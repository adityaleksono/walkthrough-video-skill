<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team tasks (demo app for the walkthrough-video skill)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1a1b1e; background: #f6f7f9; }
  header { background: #fff; border-bottom: 1px solid #e3e6ea; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
  header strong { font-size: 18px; }
  main { max-width: 820px; margin: 40px auto; padding: 0 24px; }
  h1 { font-size: 26px; margin: 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .actions { display: flex; gap: 10px; }
  button, select, input { font: inherit; }
  button { border: 1px solid #ced4da; background: #fff; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button.primary { background: #228be6; border-color: #228be6; color: #fff; font-weight: 600; }
  select { border: 1px solid #ced4da; border-radius: 8px; padding: 8px 12px; background: #fff; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.task { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  li.task.done span { text-decoration: line-through; color: #868e96; }
  li.task small { margin-left: auto; color: #868e96; }
  form { display: none; background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 18px; margin-bottom: 16px; gap: 10px; align-items: end; }
  form.open { display: flex; }
  form label { flex: 1; font-size: 14px; font-weight: 600; }
  form input { display: block; width: 100%; margin-top: 6px; border: 1px solid #ced4da; border-radius: 8px; padding: 8px 12px; }
  #toast { position: fixed; right: 24px; top: 84px; background: #2b8a3e; color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 600; opacity: 0; transition: opacity .25s; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header><strong>Acme Workspace</strong><span>Signed in as Demo Member</span></header>
<main>
  <div class="bar">
    <h1>Team tasks</h1>
    <div class="actions">
      <select id="filter" aria-label="Show">
        <option value="all">All tasks</option>
        <option value="open">Open only</option>
      </select>
      <button class="primary" id="add">Add task</button>
    </div>
  </div>
  <form id="form">
    <label>Task name<input id="name" autocomplete="off"></label>
    <button class="primary" type="submit">Save task</button>
  </form>
  <ul id="list"></ul>
</main>
<div id="toast" role="status">Task saved</div>
<script>
  const tasks = [
    { name: 'Draft the release notes', owner: 'Lena', done: false },
    { name: 'Review the pricing page', owner: 'Brian', done: true },
    { name: 'Book the demo room', owner: 'Lena', done: false },
    { name: 'Send the onboarding survey', owner: 'Priya', done: true },
  ];
  const list = document.getElementById('list');
  const filter = document.getElementById('filter');
  const form = document.getElementById('form');
  const render = () => {
    list.innerHTML = '';
    tasks.filter((t) => filter.value === 'all' || !t.done).forEach((t) => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');
      li.innerHTML = '<input type="checkbox" ' + (t.done ? 'checked' : '') + ' disabled><span></span><small></small>';
      li.querySelector('span').textContent = t.name;
      li.querySelector('small').textContent = t.owner;
      list.appendChild(li);
    });
  };
  document.getElementById('add').onclick = () => { form.classList.add('open'); document.getElementById('name').focus(); };
  form.onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    if (!name) return;
    tasks.unshift({ name, owner: 'Demo Member', done: false });
    form.classList.remove('open');
    form.reset();
    render();
    const toast = document.getElementById('toast');
    toast.classList.add('on');
    setTimeout(() => toast.classList.remove('on'), 2600);
  };
  filter.onchange = render;
  render();
</script>
</body>
</html>
